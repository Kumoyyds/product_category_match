# English only -- this tool does not translate, the input must already be English.

input:
  path: "input_data/fileexample.xlsx"   # xlsx | csv | json | jsonl
  # columns/keys must be level_1, level_2, ... level_n (ascending;
  # the last one may be free text such as an SKU name)

taxonomy:
  path: "data/taxonomy.xlsx"            # xlsx | csv | json | jsonl
  # columns/keys must be cat_1, cat_2, ... cat_n

output:
  path: "output/output.xlsx"            # xlsx | csv | json | jsonl

matching:
  algo: "weighed_embedding"                    # weighed_embedding | tree_based
  max_level: 6                         # deepest taxonomy level to match to
  flexible: true                        # true: level <= max_level; false: level == max_level
  beam_width: 3                         # tree_based only: candidates kept per level

embedding:
  model_path: "model/all-mpnet-base-v2" # local sentence-transformers weights
  model_name: "all-mpnet-base-v2"       # part of the db key, keeps models apart
  batch_size: 12
  db_path: "cache/embeddings.sqlite"    # taxonomy embeddings only

compact:
  enabled: true                         # shorten the input's last (free-text) level
  threshold_words: 20                   # anything longer goes through the LLM
  prompt_path: "prompts/compact_prompt.txt"
  llm:
    # api_key / base_url / model live in .env (api_key is required there)
    temperature: 0.0                    # compaction must be reproducible
    concurrency: 16
    request_timeout: 60
    max_retries: 3
    max_output_tokens: 512

selection:
  enabled: True                        # let an LLM pick among the matcher's top-k
  top_k: 10                              # must be >= 2 when enabled
  prompt_path: "prompts/select_prompt.txt"
  llm:
    # api_key / base_url / model live in .env (api_key is required there)
    temperature: 0.0
    concurrency: 16
    request_timeout: 60
    max_retries: 3
    max_output_tokens: 32
